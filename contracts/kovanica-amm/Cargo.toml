[package]
name = "kovanica-amm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Constant-product (x * y = k) Native AMM / DEX WASM contract for Kovanica Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = "1.3"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
